name: restore-structure
on: workflow_dispatch
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild the repository from the uploaded zip
        run: |
          set -e
          ZIP=$(ls *.zip | head -1)
          mkdir /tmp/new
          unzip -q "$ZIP" -d /tmp/new
          SRC=$(find /tmp/new -mindepth 1 -maxdepth 1 -type d | head -1)
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a "$SRC"/. .
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Restore folder structure from bundle" || echo "nothing to commit"
          git push
